<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script src="//discovery.ie.edu/js/forms2/js/forms2.min.js"></script>
    <form id="mktoForm_1102"></form>
    <script>
      MktoForms2.loadForm('//discovery.ie.edu', '928-JRO-529', 1102, (form) => {
        const countryField = form.getFormElem().find('select[id="ie_countryid"]');
        // Add value to cpuntry 9c4032be-a5f1-df11-af0a-02bf0a09015e
        countryField.append(
          '<option value="a84032be-a5f1-df11-af0a-02bf0a09015e">Australia</option>',
        );
        //select the value
        countryField.val('a84032be-a5f1-df11-af0a-02bf0a09015e');

        // find province ie_provinceregionid and add and select valveu d1af35e9-43ec-e011-a5f5-005056b460d2
        const provinceField = form.getFormElem().find('select[id="ie_provinceregionid"]');
        provinceField.append('<option value="d1af35e9-43ec-e011-a5f5-005056b460d2">Act</option>');
        provinceField.val('d1af35e9-43ec-e011-a5f5-005056b460d2');

        // onsubmit redirect to google.com
        form.onSubmit(() => {
          window.location.href = 'https://www.google.com';
          return false;
        });
      });
    </script>

    <script type="text/javascript">
      (function () {
        var didInit = false;
        function initMunchkin() {
          if (didInit === false) {
            didInit = true;
            Munchkin.init('928-JRO-529');
          }
        }
        var s = document.createElement('script');
        s.type = 'text/javascript';
        s.async = true;
        s.src = '//munchkin.marketo.net/munchkin.js';
        s.onreadystatechange = function () {
          if (this.readyState == 'complete' || this.readyState == 'loaded') {
            initMunchkin();
          }
        };
        s.onload = initMunchkin;
        document.getElementsByTagName('head')[0].appendChild(s);
      })();
    </script>
  </body>
</html>
